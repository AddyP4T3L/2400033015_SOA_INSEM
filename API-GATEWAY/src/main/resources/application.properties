spring.application.name=API-GATEWAY
server.port=9090
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Student Service Route
spring.cloud.gateway.server.webmvc.routes[0].id=student-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://STUDENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/student/**

# Faculty Service Route
spring.cloud.gateway.server.webmvc.routes[1].id=faculty-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://FACULTY-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/faculty/**

# Department Service Route
spring.cloud.gateway.server.webmvc.routes[2].id=department-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://DEPARTMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/department/**

# Course Service Route
spring.cloud.gateway.server.webmvc.routes[3].id=course-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://COURSE-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/course/**